<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trandy Admin Panel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #D4AF37; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; border: 1px solid #eee; padding: 15px; border-radius: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-save { background: #28a745; color: white; width: 100%; font-size: 1.2rem; margin-top: 20px; }
        .btn-login { background: #007bff; color: white; }
        .btn-upload { background: #D4AF37; color: white; font-size: 0.9rem; margin-top: 5px; }
        #admin-panel { display: none; }
        #login-panel { text-align: center; max-width: 400px; margin: 100px auto; }
        .preview-img { width: 100px; height: 60px; object-fit: cover; margin-top: 5px; border: 1px solid #ccc; display: block;}
        .section-header { background: #eee; padding: 10px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="login-panel" class="container">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email" style="margin-bottom:10px;"><br>
        <input type="password" id="password" placeholder="Password" style="margin-bottom:10px;"><br>
        <button class="btn-login" onclick="login()">Login</button>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-panel" class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Website Manager</h2>
            <button onclick="logout()" style="background:#dc3545; color:white;">Logout</button>
        </div>

        <!-- Style Selector -->
        <div class="form-group">
            <label>Select Website Style:</label>
            <select id="styleSelector">
                <option value="style1">Style 01 (Luxury Gold/Dark)</option>
                <option value="style2">Style 02 (Orange/Blue Construction)</option>
                <option value="style3">Style 03 (Classic Modern)</option>
                <option value="style4">Style 04 (Dark Blue Professional)</option>
            </select>
        </div>

        <div id="content-manager">
            <!-- Dynamic Inputs will be generated here by JS -->
        </div>

        <button class="btn-save" onclick="saveData()">SAVE CHANGES</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUjzMFao9BS3uXBOW3qYrLVqHaGn8qIk4",
            authDomain: "onlineshop-30cd1.firebaseapp.com",
            projectId: "onlineshop-30cd1",
            storageBucket: "onlineshop-30cd1.firebasestorage.app",
            messagingSenderId: "818252574868",
            appId: "1:818252574868:web:8dd36825db589a886cc481",
            measurementId: "G-6YLGGH2NDD"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        // --- Sections Configuration ---
        const sections = [
            { id: 'hero', title: '1. Hero Section (Slideshow)', count: 5, type: 'image' },
            { id: 'about', title: '2. About Section (Vertical)', count: 5, type: 'image' },
            { id: 'parallax', title: '3. Parallax Banner', count: 1, type: 'image' },
            { id: 'portfolio', title: '4. Project Portfolio (Gallery)', count: 13, type: 'image' }, // 13 items in style 2/4
            { id: 'tiktok', title: '5. TikTok Videos', count: 5, type: 'video' },
            { id: 'media', title: '6. Media Gallery', count: 3, type: 'video' }
        ];

        // --- Auth Logic ---
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadData();
            } else {
                document.getElementById('login-panel').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
            }
        });

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }
        function logout() { auth.signOut(); }

        // --- Generate Admin UI ---
        function generateUI() {
            const container = document.getElementById('content-manager');
            container.innerHTML = '';

            sections.forEach(sec => {
                let html = `<div class="section-header">${sec.title}</div>`;
                for(let i=0; i < sec.count; i++) {
                    const key = sec.count === 1 ? sec.id : `${sec.id}_${i}`;
                    html += `
                    <div class="form-group">
                        <label>${sec.type === 'video' ? 'Video' : 'Image'} ${i+1}</label>
                        <input type="text" id="url_${key}" placeholder="Current URL">
                        ${sec.type === 'image' ? `<img id="preview_${key}" class="preview-img" src="">` : ''}
                        <input type="file" id="file_${key}" accept="${sec.type}/*">
                        <button class="btn-upload" onclick="uploadFile('${key}', '${sec.id}')">Upload & Set</button>
                    </div>`;
                }
                container.innerHTML += html;
            });
        }
        generateUI();

        // --- Data Logic ---
        function loadData() {
            db.ref('siteConfig').once('value').then(snap => {
                const data = snap.val() || {};
                
                // Set Style
                if(data.style) document.getElementById('styleSelector').value = data.style;

                // Set URLs
                sections.forEach(sec => {
                    for(let i=0; i < sec.count; i++) {
                        const key = sec.count === 1 ? sec.id : `${sec.id}_${i}`;
                        const savedUrl = (data[sec.id] && data[sec.id][i]) ? data[sec.id][i] : ''; 
                        
                        // Handle single item vs array logic in DB
                        let val = '';
                        if(sec.count === 1) val = data[sec.id] || '';
                        else val = (data[sec.id] && data[sec.id][i]) ? data[sec.id][i] : '';

                        if(document.getElementById(`url_${key}`)) {
                            document.getElementById(`url_${key}`).value = val;
                            if(sec.type === 'image' && val) document.getElementById(`preview_${key}`).src = val;
                        }
                    }
                });
            });
        }

        function uploadFile(key, parentId) {
            const fileInput = document.getElementById(`file_${key}`);
            const file = fileInput.files[0];
            if(!file) return alert("Please select a file first");

            const ref = storage.ref(`uploads/${parentId}/${new Date().getTime()}_${file.name}`);
            ref.put(file).then(snapshot => {
                snapshot.ref.getDownloadURL().then(url => {
                    document.getElementById(`url_${key}`).value = url;
                    if(document.getElementById(`preview_${key}`)) {
                        document.getElementById(`preview_${key}`).src = url;
                    }
                    alert("Upload Successful!");
                });
            });
        }

        function saveData() {
            const style = document.getElementById('styleSelector').value;
            const updateData = { style: style };

            sections.forEach(sec => {
                if(sec.count === 1) {
                    updateData[sec.id] = document.getElementById(`url_${sec.id}`).value;
                } else {
                    updateData[sec.id] = [];
                    for(let i=0; i < sec.count; i++) {
                        const key = `${sec.id}_${i}`;
                        updateData[sec.id].push(document.getElementById(`url_${key}`).value);
                    }
                }
            });

            db.ref('siteConfig').set(updateData)
                .then(() => alert("Website Updated Successfully! Go to index.html to see changes."))
                .catch(err => alert(err.message));
        }
    </script>
</body>
</html>
